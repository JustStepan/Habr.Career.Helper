name: Deploy to Production

on:
  push:
    branches: [ main ]

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  BACKEND_IMAGE: habr-parser-backend
  FRONTEND_IMAGE: habr-parser-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        run: |
          cd backend
          docker buildx build \
            --platform linux/amd64 \
            --tag ${{ env.DOCKERHUB_USERNAME }}/${{ env.BACKEND_IMAGE }}:latest \
            --load \
            .

      - name: Build Frontend Image
        run: |
          cd frontend
          docker buildx build \
            --platform linux/amd64 \
            --tag ${{ env.DOCKERHUB_USERNAME }}/${{ env.FRONTEND_IMAGE }}:latest \
            --load \
            .
      
      - name: Push Backend Image
        run: |
          docker push ${{ env.DOCKERHUB_USERNAME }}/${{ env.BACKEND_IMAGE }}:latest
      
      - name: Push Frontend Image
        run: |
          docker push ${{ env.DOCKERHUB_USERNAME }}/${{ env.FRONTEND_IMAGE }}:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/stefan/habr-vacancies-helper

            # Останавливаем старые контейнеры
            docker compose -f docker-compose.prod.yml down || true

            # Скачиваем docker-compose.prod.yml
            curl -o docker-compose.prod.yml https://raw.githubusercontent.com/juststepan/Habr.Career.Helper/main/docker-compose.prod.yml

            # Удаляем старые образы и кэш (чтобы избежать ошибок с манифестами)
            docker rmi stepandko/habr-parser-backend:latest || true
            docker rmi stepandko/habr-parser-frontend:latest || true

            # Подтягиваем новые образы
            docker compose -f docker-compose.prod.yml pull

            # Запускаем контейнеры
            docker compose -f docker-compose.prod.yml up -d

            # Чистим неиспользуемые образы
            docker image prune -af