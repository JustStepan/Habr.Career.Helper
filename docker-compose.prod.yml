services:
  backend:
    image: stepandko/habr-parser-backend:latest
    container_name: habr_parser_backend
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: summarizer_postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
    networks:
      - text-summarizer_default
    ports:
      - "8002:8000"
    restart: unless-stopped

  frontend:
    image: stepandko/habr-parser-frontend:latest
    container_name: habr_parser_frontend
    ports:
      - "3001:80"
    restart: unless-stopped

networks:
  text-summarizer_default:
    external: true