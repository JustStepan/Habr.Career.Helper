services:
  postgres:
    image: postgres:16-alpine
    container_name: habr_parser_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    restart: unless-stopped

  # ============================================
  # Backend (FastAPI)
  # ============================================
  backend:
    image: stepandko/habr-parser-backend:latest
    container_name: habr_parser_backend
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
    depends_on:
      - postgres
    networks:
      - app-network
    ports:
      - "8002:8000"  # ← Открываем для хостового Nginx!
    restart: unless-stopped

  frontend:
    image: stepandko/habr-parser-frontend:latest
    container_name: habr_parser_frontend
    networks:
      - app-network
    ports:
      - "3001:80"    # ← Открываем для хостового Nginx!
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local