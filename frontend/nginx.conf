server {
    listen 80;
    
    # Корневая папка со статикой
    root /usr/share/nginx/html;
    index index.html;
    
    # Отключаем показ версии Nginx (безопасность)
    server_tokens off;
    
    # ============================================
    # Security Headers (защита от XSS, clickjacking)
    # ============================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    
    # ============================================
    # Основной location для React Router
    # ============================================
    location / {
        # Пробуем найти файл ($uri)
        # Если нет — пробуем папку ($uri/)
        # Если нет — отдаём index.html (для клиентского роутинга)
        try_files $uri $uri/ /index.html;
        
        # НЕ кэшируем index.html (чтобы всегда получать свежую версию)
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
    }
    
    # ============================================
    # Кэширование статических файлов (JS, CSS, изображения)
    # ============================================
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        # Кэшируем на 1 год
        expires 1y;
        add_header Cache-Control "public, immutable";
        
        # Логирование доступа не нужно для статики
        access_log off;
    }
    
    # ============================================
    # Gzip сжатие для ускорения загрузки
    # ============================================
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;  # Сжимаем файлы больше 1KB
    gzip_comp_level 6;     # Уровень сжатия (1-9, 6 оптимально)
    gzip_types 
        text/plain 
        text/css 
        text/xml 
        text/javascript 
        application/json 
        application/javascript 
        application/xml+rss 
        application/rss+xml 
        font/truetype 
        font/opentype 
        application/vnd.ms-fontobject 
        image/svg+xml;
    
    # ============================================
    # Обработка ошибок
    # ============================================
    error_page 404 /index.html;  # 404 → index.html (React обработает)
    error_page 500 502 503 504 /50x.html;
    
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}